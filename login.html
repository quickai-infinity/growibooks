<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrowiBooks — Ingresar</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

<script src="theme.js"></script>

<style>
  :root { --bg:#f7f9f4; --green:#2daa5f; --green-dark:#1d8047; --text:#1a2e1a; --text2:#4a6741; --r:18px; }
  body { background:var(--bg); font-family:'Quicksand',sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; transition: background 0.3s ease; }
  .auth-card { background:#fff; padding:40px; border-radius:var(--r); box-shadow:0 10px 30px rgba(45,170,95,.1); width:100%; max-width:400px; text-align:center; transition: all 0.3s ease; }
  .logo { font-family:'Nunito',sans-serif; font-size:24px; font-weight:900; color:var(--text); margin-bottom:30px; text-decoration:none; display:block; }
  h2 { font-family:'Nunito'; color:var(--text); margin-bottom:10px; }
  input { width:100%; padding:14px; margin-bottom:12px; border:2px solid #e4ecdc; border-radius:12px; outline:none; font-family:inherit; transition: all 0.3s ease; box-sizing: border-box; }
  input:focus { border-color:var(--green); }
  
  .btn-auth { width:100%; padding:16px; background:linear-gradient(135deg,var(--green),var(--green-dark)); color:#fff; border:none; border-radius:12px; font-weight:800; cursor:pointer; font-family:'Nunito'; transition: opacity 0.3s ease; }
  .toggle-auth { margin-top:20px; font-size:13px; color:var(--text2); cursor:pointer; }

  /* Estilos del separador y botones sociales */
  .divider { margin: 20px 0; display: flex; align-items: center; text-align: center; color: var(--text2); }
  .divider hr { flex: 1; border: none; border-top: 1px solid #e4ecdc; }
  .divider span { padding: 0 10px; font-size: 14px; font-weight: 700; }
  
  .btn-social { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 14px; background: #fff; color: var(--text); border: 2px solid #e4ecdc; border-radius: 12px; font-weight: 700; cursor: pointer; font-family: 'Quicksand', sans-serif; transition: all 0.3s ease; box-sizing: border-box; margin-bottom: 12px; }
  .btn-social:hover { background: #f7f9f4; border-color: #d1d9c9; }

  /* MODO OSCURO */
  body.dark-mode {
      --bg: #121212 !important;
      --text: #e0e0e0 !important;
      --text2: #aaaaaa !important;
  }
  body.dark-mode .auth-card {
      background: #1e1e1e !important;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5) !important;
  }
  body.dark-mode input {
      background: #2d2d2d !important;
      color: #fff !important;
      border-color: #444 !important;
  }
  body.dark-mode .divider hr { border-top-color: #444 !important; }
  body.dark-mode .btn-social { background: #2d2d2d !important; color: #fff !important; border-color: #444 !important; }
  body.dark-mode .btn-social:hover { background: #3d3d3d !important; }
</style>
</head>
<body>

<div class="auth-card">
  <a href="index.html" class="logo" style="display:flex; align-items:center; justify-content:center; gap:12px;">
    <img src="icon-96.webp" alt="GrowiBooks" style="width: 48px; height: 48px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);"> 
    <div><span style="color:var(--green)">Growi</span>Books</div>
  </a>
  <h2 id="authTitle">Bienvenido</h2>
  <p id="authSub" style="font-size:14px; color:var(--text2); margin-bottom:24px;">Ingresa tus credenciales</p>
  
  <!-- Contenedor de Email que se oculta en Registro -->
  <div id="emailAuthSection">
      <input type="email" id="email" placeholder="Tu correo electrónico">
      <input type="password" id="password" placeholder="Tu contraseña">
      <button class="btn-auth" id="btnAuth">Entrar</button>

      <div class="divider">
          <hr><span>o</span><hr>
      </div>
  </div>

  <!-- Botón Google -->
  <button class="btn-social" id="btn-google-login">
      <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continuar con Google
  </button>

  <!-- Botón Apple (Inactivo funcionalmente hasta que configures la cuenta Developer) -->
  <button class="btn-social" id="btn-apple-login">
      <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.15 2.95.97 3.67 2.15-3.22 1.96-2.67 6.13.78 7.39-.77 1.41-1.6 2.45-3.1 3.47zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.35 2.4-1.95 4.35-3.74 4.25z" fill="currentColor"/>
      </svg>
      Continuar con Apple
  </button>

  <p class="toggle-auth" id="btnToggle">¿No tienes cuenta? Regístrate aquí</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  if (typeof window.supabase === 'undefined') {
      alert("🚨 Error crítico: Supabase no se cargó.");
  } else {
      // 1. INICIALIZACIÓN DE SUPABASE
      const SUPABASE_URL = 'https://wsoqjaynqeoejmwwwsyo.supabase.co';
      const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indzb3FqYXlucWVvZWptd3d3c3lvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3NDc3NDgsImV4cCI6MjA5ODMyMzc0OH0.99-PAaaJoowd63I5FS_IGvQNY4rMg5Yn9TQM21rXDac'; 
      
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: { persistSession: true, autoRefreshToken: true }
      });

      const urlParams = new URLSearchParams(window.location.search);
      const planPendiente = urlParams.get('plan');

      // 2. FUNCIÓN PARA ENTRAR A LA APP (CON PAUSA Y RESPALDO)
      function enrutarUsuario(session) {
        localStorage.setItem('sb-wsoqjaynqeoejmwwwsyo-auth-token', JSON.stringify(session));
        
        document.body.innerHTML = `
            <div style='background: #f7f9f4; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh;'>
                <h2 style='color: #2daa5f; font-family: Nunito, sans-serif;'>Conectando...</h2>
            </div>
        `;
        document.body.style.background = "#f7f9f4";

        setTimeout(() => {
            if (!planPendiente) return window.location.replace('ebooks.html');
            if (planPendiente === 'free') return window.location.replace('dashboard.html');

            const stripeParams = `?client_reference_id=${session.user.id}&prefilled_email=${encodeURIComponent(session.user.email)}`;
            if (planPendiente === 'price_standard_123') window.location.replace('https://buy.stripe.com/dRmcN5cR14oEaY4gBif7i03' + stripeParams);
            else if (planPendiente === 'price_pro_123') window.location.replace('https://buy.stripe.com/14A4gz7wH8EUaY45WEf7i02' + stripeParams);
            else window.location.replace('ebooks.html');
        }, 500);
      }

      supabase.auth.getSession().then(({ data: { session } }) => {
        if (session) enrutarUsuario(session);
      });

      // 3. FUNCIÓN SILENCIOSA QUE RECIBE A GOOGLE (SIN ALERTAS)
      async function procesarUrlDeGoogle(url) {
          if (url && url.includes('#access_token')) {
              const hashString = url.split('#')[1];
              const params = new URLSearchParams(hashString);
              
              const accessToken = params.get('access_token');
              const refreshToken = params.get('refresh_token');

              if (accessToken && refreshToken) {
                  const { data, error } = await supabase.auth.setSession({
                      access_token: accessToken,
                      refresh_token: refreshToken
                  });
                  
                  if (!error && data.session) {
                      enrutarUsuario(data.session);
                  }
              }
          }
      }

      // 4. SENSORES DE CAPACITOR SILENCIOSOS
      if (window.Capacitor && window.Capacitor.Plugins.App) {
          const App = window.Capacitor.Plugins.App;
          
          App.addListener('appUrlOpen', (event) => {
              procesarUrlDeGoogle(event.url);
          });

          App.getLaunchUrl().then((ret) => {
              if (ret && ret.url && ret.url.includes('growibooks://')) {
                  procesarUrlDeGoogle(ret.url);
              }
          });
      }

      // 5. BOTONES SOCIALES
      document.getElementById('btn-google-login').addEventListener('click', async (e) => {
          e.preventDefault();
          const btn = e.currentTarget;
          btn.style.opacity = "0.7"; btn.disabled = true;
          
          try {
              const { data, error } = await supabase.auth.signInWithOAuth({
                  provider: 'google',
                  options: { skipBrowserRedirect: true, redirectTo: 'growibooks://login' }
              });
              if (error) { alert("Error: " + error.message); return; }
              if (data && data.url) { window.location.href = data.url; }
          } catch (error) {
              alert("Fallo crítico en Google.");
          } finally {
              btn.style.opacity = "1"; btn.disabled = false;
          }
      });

      document.getElementById('btn-apple-login').addEventListener('click', async (e) => {
          e.preventDefault();
          const btn = e.currentTarget;
          btn.style.opacity = "0.7"; btn.disabled = true;
          
          try {
              const { data, error } = await supabase.auth.signInWithOAuth({
                  provider: 'apple',
                  options: { skipBrowserRedirect: true, redirectTo: window.location.href }
              });
              if (error) { alert("Error: " + error.message); return; }
              if (data && data.url) { window.location.href = data.url; }
          } catch (error) {
              alert("Fallo crítico en Apple.");
          } finally {
              btn.style.opacity = "1"; btn.disabled = false;
          }
      });

// 6. EMAIL Y PASSWORD (AHORA CON REGISTRO)
      let isLogin = true;
      const emailAuthSection = document.getElementById('emailAuthSection');
      const btnToggle = document.getElementById('btnToggle');
      const btnAuth = document.getElementById('btnAuth');

      btnToggle.onclick = () => {
        isLogin = !isLogin;
        
        // Ya NO ocultamos la sección, solo cambiamos los textos
        document.getElementById('authTitle').textContent = isLogin ? 'Bienvenido' : 'Crear Cuenta';
        document.getElementById('authSub').textContent = isLogin ? 'Ingresa tus credenciales' : 'Regístrate con tu correo o redes sociales';
        btnToggle.textContent = isLogin ? '¿No tienes cuenta? Regístrate aquí' : '¿Ya tienes cuenta? Entra aquí';
        btnAuth.textContent = isLogin ? 'Entrar' : 'Registrarme';
      };

      btnAuth.onclick = async () => {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        if (!email || !password) return alert("Llena todos los campos.");

        btnAuth.textContent = "Conectando..."; btnAuth.disabled = true; btnAuth.style.opacity = "0.7";

        try {
            if (isLogin) {
                // FLUJO DE INGRESO NORMAL
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if(error) throw error; 
                enrutarUsuario(data.session);
            } else {
                // FLUJO DE REGISTRO NUEVO
                const { data, error } = await supabase.auth.signUp({ 
                    email, 
                    password,
                    options: {
                        emailRedirectTo: 'growibooks://login' 
                    }
                });
                
                if(error) throw error; 
                
                if (data.user && data.user.identities && data.user.identities.length === 0) {
                    alert("Este correo ya está registrado. Intenta iniciar sesión.");
                } else {
                    alert("¡Revisa tu correo! Te hemos enviado un enlace para confirmar tu cuenta.");
                    // Volvemos a poner la pantalla en modo login
                    btnToggle.click();
                }
            }
        } catch (err) {
            alert("Error: " + (err.message || "No se pudo conectar."));
        } finally {
            btnAuth.textContent = isLogin ? 'Entrar' : 'Registrarme'; 
            btnAuth.disabled = false; 
            btnAuth.style.opacity = "1";
        }
      };
  }
</script>
</body>
</html>
