<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GrowiPlay — ¡A jugar!</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="theme.js"></script>
    <style>
        :root {
            --bg: #f7f9f4; --lime: #2daa5f; --gold: #ff7b2c; --text: #1a2e1a;
            --shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg);
            margin: 0;
            overflow: hidden; 
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

 /* BARRA SUPERIOR ESTRUCTURADA */
        .toolbar {
            background: white;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow);
            z-index: 10;
            height: 70px;
        }

        .toolbar-main {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 8px;
            border-right: 2px solid #eee;
            padding-right: 15px;
        }

        .pencil {
            width: 35px; height: 35px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .pencil.active { transform: scale(1.2); border-color: var(--text); }

        .btn-action {
            background: var(--bg); color: var(--text);
            border: 2px solid #ddd; padding: 8px 15px;
            border-radius: 20px; font-weight: 800;
            cursor: pointer; display: flex; align-items: center; gap: 5px;
        }
        .btn-action.primary { background: var(--gold); color: white; border: none; }
        
        input[type="color"] {
            width: 40px; height: 40px; border: none;
            border-radius: 50%; cursor: pointer;
            padding: 0; background: none;
        }
        input[type="range"] { width: 80px; }

        /* MENÚ DESPLEGABLE MÓVIL (Por defecto oculto en PC/Horizontal) */
        .btn-menu-toggle { 
            display: none; 
            font-size: 13px; 
            font-weight: 800;
            background: var(--bg5); 
            color: var(--text);
            border: 2px solid #ddd; 
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer; 
            font-family: 'Nunito', sans-serif;
        }        
        .mobile-menu {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* COMPORTAMIENTO VERTICAL (MÓVIL) */
        @media (max-width: 768px) and (orientation: portrait) {
            .btn-menu-toggle { display: block; }
            
            .mobile-menu {
                display: none; /* Se oculta por defecto */
                position: absolute;
                top: 75px; right: 15px;
                background: white;
                border: 2px solid #ddd;
                border-radius: 12px;
                padding: 15px;
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
                box-shadow: var(--shadow);
                z-index: 100;
            }
            
            .mobile-menu.active {
                display: flex; /* Se muestra al pulsar los puntos */
            }

            .tool-group {
                border-right: none;
                border-bottom: 2px solid #eee;
                padding-right: 0;
                padding-bottom: 10px;
                width: 100%;
                justify-content: flex-start;
            }
        }

        /* ÁREA DE JUEGO */
        .game-container {
            flex-grow: 1;
            position: relative;
            background: #e0e0e0;
            overflow: hidden; /* FabricJS maneja su propio pan/zoom */
        }

        .canvas-container { margin: 0 auto; }
    </style>
</head>
<body>

<div class="toolbar">
    <div class="toolbar-main">
        <button class="btn-action" onclick="window.history.back()">⬅️</button>
        
        <div class="tool-group">
            <input type="color" id="colorPicker" value="#2daa5f" onchange="setBrushColor(this.value, null)">
            <div class="pencil active" style="background: #2daa5f;" onclick="setBrushColor('#2daa5f', this)"></div>
            <div class="pencil" style="background: #ff7b2c;" onclick="setBrushColor('#ff7b2c', this)"></div>
            <div class="pencil" style="background: #7c4dff;" onclick="setBrushColor('#7c4dff', this)"></div>
        </div>
    </div>

    <button class="btn-menu-toggle" onclick="toggleMobileMenu()">📋 HERRAMIENTAS</button>
     
    <div class="mobile-menu" id="mobileMenu">
        <div class="tool-group">
            <button class="btn-action" onclick="zoomCanvas(1.1)">🔍+</button>
            <button class="btn-action" onclick="zoomCanvas(0.9)">🔍-</button>
            <div class="pencil" style="background: #ffffff; border: 1px solid #ccc; display:flex; align-items:center; justify-content:center;" onclick="setBrushColor('#ffffff', this)">🧽</div>
        </div>

        <div class="tool-group">
            <span>🖌️</span>
            <input type="range" id="brushSize" min="2" max="40" value="8" onchange="setBrushSize(this.value)">
        </div>

        <div class="tool-group">
            <button class="btn-action" onclick="addSticker('⭐')">⭐ Sello</button>
            <button class="btn-action" onclick="addSticker('🚗')">🚗 Auto</button>
        </div>

        <button class="btn-action primary" onclick="clearCanvas(); toggleMobileMenu();">✨ Limpiar</button>
    </div>
</div>

<div class="game-container" id="container">
    <canvas id="gameCanvas"></canvas>
</div>

<script>
    // Inicializar Fabric.js
    const canvas = new fabric.Canvas('gameCanvas', {
        isDrawingMode: true,
        width: window.innerWidth,
        height: window.innerHeight - 70 // Restar altura del toolbar
    });

    const urlParams = new URLSearchParams(window.location.search);
    const imageUrl = urlParams.get('img');

    // CONFIGURACIÓN INICIAL DEL PINCEL
    canvas.freeDrawingBrush.color = '#2daa5f';
    canvas.freeDrawingBrush.width = 8;

    function initCanvas() {
        if (imageUrl) {
            fabric.Image.fromURL(imageUrl, function(img) {
                // Escalar imagen para que encaje en la pantalla
                const scale = Math.min(canvas.width / img.width, canvas.height / img.height);
                img.scale(scale);

                // Centrar la imagen
                canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas), {
                    originX: 'center', originY: 'center',
                    left: canvas.width / 2, top: canvas.height / 2
                });
            }, { crossOrigin: 'anonymous' });
        }
    }

    // HERRAMIENTAS DE DIBUJO
    function setBrushColor(color, el) {
        canvas.isDrawingMode = true; // Asegurar que puede pintar
        canvas.freeDrawingBrush.color = color;
        if(el) {
            document.querySelectorAll('.pencil').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
        }
    }

    function setBrushSize(size) {
        canvas.freeDrawingBrush.width = parseInt(size, 10);
    }

    function clearCanvas() {
        canvas.clear();
        initCanvas();
    }

    // SISTEMA DE ZOOM BÁSICO
    function zoomCanvas(factor) {
        let currentZoom = canvas.getZoom();
        let newZoom = currentZoom * factor;
        // Limitar el zoom para que no se pierdan
        if(newZoom > 0.5 && newZoom < 5) {
            canvas.zoomToPoint({ x: canvas.width / 2, y: canvas.height / 2 }, newZoom);
        }
    }

    // AÑADIR STICKERS (Textos con Emojis como sellos rápidos)
    function addSticker(emoji) {
        canvas.isDrawingMode = false; // Desactivar dibujo temporalmente para mover el sticker
        const text = new fabric.Text(emoji, {
            left: canvas.width / 2,
            top: canvas.height / 2,
            fontSize: 50,
            selectable: true // Permite que el niño lo arrastre
        });
        canvas.add(text);
        canvas.setActiveObject(text);
        
        // Volver a activar el pincel al deseleccionar el sticker
        canvas.on('selection:cleared', function() {
            canvas.isDrawingMode = true;
        });
    }

    // EVENTOS PARA PANTALLAS TÁCTILES Y REDIMENSIONAMIENTO
    window.addEventListener('resize', () => {
        canvas.setWidth(window.innerWidth);
        canvas.setHeight(window.innerHeight - 70);
        initCanvas();
    });

    initCanvas();

    function toggleMobileMenu() {
        const menu = document.getElementById('mobileMenu');
        if (menu) {
            menu.classList.toggle('active');
        }
    }
</script>

</body>
</html>
